name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dashboard.txt
      # Service and dashboard dependencies plus test tools: torch/lightgbm are not needed by the tests.
      - run: pip install -r requirements.txt -r requirements-dashboard.txt pytest httpx
      - run: python -m pytest tests -q
